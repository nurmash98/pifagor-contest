{% load static %}
{# Ночной / дневной режим: применяем сохранённую тему ДО отрисовки (без мигания) и стили тёмной темы. #}
<script>
(function () {
    var theme = null;
    try { theme = localStorage.getItem('pifagor-theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-bs-theme', theme);
})();
</script>
<style>
    /* ---------- Кнопка переключения темы ---------- */
    .theme-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; padding: 0; border-radius: 50%;
        border: 1px solid var(--bs-border-color); background: transparent; color: var(--bs-body-color);
        cursor: pointer; transition: background-color .15s, transform .15s;
    }
    .theme-toggle:hover { background-color: var(--bs-tertiary-bg); transform: rotate(12deg); }
    .theme-toggle:focus-visible { outline: 2px solid #008b42; outline-offset: 2px; }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .theme-icon-sun { display: none; }
    [data-bs-theme="dark"] .theme-toggle .theme-icon-sun { display: block; }
    [data-bs-theme="dark"] .theme-toggle .theme-icon-moon { display: none; }
    .theme-toggle-floating { position: fixed; top: 16px; right: 16px; z-index: 1030; background: var(--bs-body-bg); }

    /* ---------- Тёмная тема ---------- */
    [data-bs-theme="dark"] {
        --bs-body-bg: #0f1424;
        --bs-body-bg-rgb: 15, 20, 36;
        --bs-body-color: #e4e7f0;
        --bs-body-color-rgb: 228, 231, 240;
        --bs-secondary-bg: #1a2036;
        --bs-tertiary-bg: #20274a;
        --bs-border-color: #2d3558;
        --bs-secondary-color: rgba(228, 231, 240, .68);
    }
    [data-bs-theme="dark"] body { background-color: var(--bs-body-bg); color: var(--bs-body-color); }

    /* фирменные цвета: тёмно-синий на тёмном фоне не виден — берём светлый оттенок */
    [data-bs-theme="dark"] .text-pifagor-blue,
    [data-bs-theme="dark"] [style^="color: #1a1a4b"],
    [data-bs-theme="dark"] [style*=" color: #1a1a4b"] { color: #c3c9ff !important; }
    [data-bs-theme="dark"] .text-pifagor-green,
    [data-bs-theme="dark"] [style*="color: #008b42"] { color: #34c27a !important; }
    [data-bs-theme="dark"] [style*="color: #2c3e50"] { color: var(--bs-body-color) !important; }

    /* белые поверхности */
    [data-bs-theme="dark"] .bg-white { background-color: var(--bs-secondary-bg) !important; }
    [data-bs-theme="dark"] .bg-light { background-color: var(--bs-tertiary-bg) !important; }
    [data-bs-theme="dark"] .card { --bs-card-bg: var(--bs-secondary-bg); --bs-card-cap-bg: var(--bs-tertiary-bg); }
    [data-bs-theme="dark"] .list-group { --bs-list-group-bg: transparent; }
    [data-bs-theme="dark"] .navbar.bg-body { background-color: var(--bs-secondary-bg) !important; }
    [data-bs-theme="dark"] .navbar-toggler-icon { filter: invert(1) grayscale(1) brightness(1.6); }
    [data-bs-theme="dark"] .auth-card { box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }

    /* тёмный текст на светлых плашках/бейджах: оставляем только там, где фон жёлтый/голубой */
    [data-bs-theme="dark"] .text-dark:not(.bg-warning):not(.bg-info):not(.bg-success):not(.btn-warning):not(.btn-info) { color: var(--bs-body-color) !important; }
    [data-bs-theme="dark"] .btn-outline-dark:not(:hover):not(.active):not(:active) { color: #e4e7f0; }
    [data-bs-theme="dark"] .btn-outline-dark {
        --bs-btn-color: #e4e7f0; --bs-btn-border-color: #6c7392;
        --bs-btn-hover-color: #0f1424; --bs-btn-hover-bg: #e4e7f0; --bs-btn-hover-border-color: #e4e7f0;
        --bs-btn-active-color: #0f1424; --bs-btn-active-bg: #e4e7f0; --bs-btn-active-border-color: #e4e7f0;
    }

    [data-bs-theme="dark"] .btn-outline-secondary:not(:hover):not(.active):not(:active) { color: #b4bad2; }
    [data-bs-theme="dark"] .btn-outline-secondary {
        --bs-btn-color: #b4bad2; --bs-btn-border-color: #4b5373;
        --bs-btn-hover-color: #0f1424; --bs-btn-hover-bg: #e4e7f0; --bs-btn-hover-border-color: #e4e7f0;
        --bs-btn-active-color: #0f1424; --bs-btn-active-bg: #e4e7f0; --bs-btn-active-border-color: #e4e7f0;
    }
    [data-bs-theme="dark"] .btn-pifagor-blue,
    [data-bs-theme="dark"] .bg-pifagor-blue { background-color: #3b40a6; color: #fff; }
    [data-bs-theme="dark"] .btn-pifagor-blue:hover { background-color: #4a50c4; color: #fff; }

    /* таблицы */
    [data-bs-theme="dark"] .table-light {
        --bs-table-color: #e4e7f0; --bs-table-bg: #232a4d; --bs-table-border-color: #2d3558;
        --bs-table-striped-bg: #232a4d; --bs-table-hover-bg: #2a3260; --bs-table-hover-color: #e4e7f0;
        color: #e4e7f0;
    }
    [data-bs-theme="dark"] [style*="background-color: #f4f6f9"] { background-color: #232a4d !important; }
    [data-bs-theme="dark"] .hover-bg-light:hover { background-color: #232a4d !important; }

    /* формы */
    [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select {
        background-color: #151b30; border-color: var(--bs-border-color); color: var(--bs-body-color);
    }
    [data-bs-theme="dark"] .form-control:focus, [data-bs-theme="dark"] .form-select:focus {
        background-color: #151b30; color: var(--bs-body-color); border-color: #34c27a; box-shadow: 0 0 0 .2rem rgba(52, 194, 122, .2);
    }
    [data-bs-theme="dark"] .form-control::placeholder { color: rgba(228, 231, 240, .4); }
    /* Аватар с рамкой по самому высокому значку за задачи */
    .pf-avatar { position: relative; display: inline-block; flex: none; vertical-align: middle; }
    .pf-avatar .pf-ring { position: absolute; inset: 0; border-radius: 50%; background: var(--bs-tertiary-bg); }
    .pf-avatar .pf-face { position: absolute; inset: 10%; border-radius: 50%; background: var(--bs-body-bg);
        display: flex; align-items: center; justify-content: center; line-height: 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
    .pf-avatar .pf-face img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 15%; background: #fff; }
    .avatar-pick summary { list-style: none; } .avatar-pick summary::-webkit-details-marker { display: none; }
    .avatar-opt { background: var(--bs-tertiary-bg); border: 2px solid transparent; border-radius: 14px; padding: 8px 6px 6px; width: 92px; color: inherit; cursor: pointer; }
    .avatar-opt:hover { border-color: var(--bs-border-color); }
    .avatar-opt.on { border-color: #34c27a; }
    .avatar-opt .ao-pic { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto 4px; border-radius: 50%; background: var(--bs-body-bg); font-size: 30px; overflow: hidden; }
    .avatar-opt .ao-pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; background: #fff; }
    .avatar-opt .ao-name { display: block; font-size: .7rem; font-weight: 700; line-height: 1.2; }
    .pf-avatar .pf-mini { position: absolute; right: -9%; bottom: -7%; }
    .pf-avatar .pf-mini svg { width: 100%; height: 100%; }
    /* дерево: светлое, матовое, с годовыми кольцами и тёмными «досками» — не путается с бронзой */
    .pf-wood .pf-ring { background: repeating-radial-gradient(circle at 50% 50%, #f1dcb2 0 2px, #d9b27a 2px 3.5px, #ead09e 3.5px 5px);
        box-shadow: 0 0 0 2px #5c3d1e, inset 0 0 0 1.5px #7a5532; }
    .pf-wood .pf-ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: repeating-conic-gradient(#6b4422 0 2.2deg, transparent 2.2deg 45deg); opacity: .8; }
    /* бронза: насыщенная медно-красная, блестящая металлом */
    .pf-bronze .pf-ring { background: conic-gradient(from 20deg, #ffd2a8, #e07a3c, #8e3a12, #c8551f, #ffcf9e, #e07a3c, #7a2e0c, #d8692c, #ffd2a8);
        box-shadow: 0 0 0 2px #5a220a, 0 0 10px rgba(224,122,60,.45); }
    .pf-silver .pf-ring { background: conic-gradient(#fff,#c3cad6,#7d8797,#c3cad6,#fff,#c3cad6,#7d8797,#fff); box-shadow: 0 0 0 2px #6b7484; }
    .pf-gold .pf-ring { background: conic-gradient(#fff1b8,#f2c230,#a8740a,#f2c230,#fff1b8,#f2c230,#a8740a,#fff1b8); box-shadow: 0 0 0 2px #8a6008, 0 0 12px rgba(242,194,48,.45); }
    .pf-diamond .pf-ring { background: conic-gradient(#f0fdff,#8fe3f5,#2d8fb3,#8fe3f5,#f0fdff,#8fe3f5,#2d8fb3,#f0fdff); box-shadow: 0 0 0 2px #2d8fb3, 0 0 16px rgba(110,220,255,.7); }
    @keyframes pf-spin { to { transform: rotate(360deg); } }
    @keyframes pf-glow { 0%,100% { box-shadow: 0 0 10px #a855f7, 0 0 4px #f97316; } 50% { box-shadow: 0 0 22px #c084fc, 0 0 10px #fb923c; } }
    .pf-legend .pf-ring { background: conic-gradient(#f97316,#a855f7,#7c3aed,#f97316,#fde047,#a855f7,#f97316); animation: pf-spin 6s linear infinite, pf-glow 2.4s ease-in-out infinite; }
    @keyframes tier-pulse { 0%,100% { filter: drop-shadow(0 0 4px #a855f7) drop-shadow(0 0 2px #f97316); } 50% { filter: drop-shadow(0 0 12px #c084fc) drop-shadow(0 0 6px #fb923c); } }
    .tier-legend { animation: tier-pulse 2.4s ease-in-out infinite; }
    .tier-diamond { filter: drop-shadow(0 0 6px rgba(110,220,255,.55)); }
    @media (prefers-reduced-motion: reduce) { .pf-legend .pf-ring, .tier-legend { animation: none; } }
    /* Баннер под именем «Флаг Казахстана»: орнамент слева, солнце с беркутом справа, блик-волна */
    .nb { position: relative; display: inline-flex; align-items: center; font-weight: 800; line-height: 1.15; overflow: hidden; white-space: nowrap; border-radius: 12px; vertical-align: middle; }
    .nb.b-flag { background: url("{% static 'icons/kz-orn.png' %}") left 6px center / auto 120% no-repeat, url("{% static 'icons/kz-sun.png' %}") right 8px center / auto 150% no-repeat, #00a6c8;
        color: #fff !important; padding: 8px 76px 8px 32px; border: 2px solid #f6c600; text-shadow: 0 1px 3px rgba(0,60,80,.6); }
    .nb.b-flag.sm { padding: 5px 58px 5px 26px; border-radius: 9px; font-size: .95em; max-width: 100%; white-space: normal; text-align: left; }
    .nb.b-flag::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 0, rgba(255,255,255,.25) 20%, transparent 40%, rgba(0,40,60,.18) 60%, transparent 80%);
        background-size: 200% 100%; animation: nb-wave 3s linear infinite; pointer-events: none; }
    @keyframes nb-wave { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .nb.b-flag::after { animation: none; } }
    .kz-gift-btn { background: #ffe066; color: #3a2a00 !important; font-weight: 800; border-radius: 99px; padding: 4px 14px; text-decoration: none; white-space: nowrap; text-shadow: none; }
    .kz-gift-btn:hover { background: #fff; }
    /* День Независимости: полоса с флагом под меню */
    .kz-holiday { background: linear-gradient(90deg, #008fa8, #00afca 40%, #00afca 60%, #008fa8); color: #fff; font-size: .95rem; text-align: center;
        border-bottom: 3px solid #f6c600; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .kz-holiday b { color: #ffe066; }
    /* Логотип: в ночном режиме — светлая версия (белые знаки, ярко-зелёное дерево) */
    .logo-dark { display: none; }
    [data-bs-theme="dark"] .logo-dark { display: inline-block; }
    [data-bs-theme="dark"] .logo-light { display: none; }
</style>
