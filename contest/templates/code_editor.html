{% comment %}Редактор кода как в IDE: цвета Python, автоотступ после «:», Tab = 4 пробела, без автозаглавной буквы.
Подключается один раз внизу страницы; превращает все textarea.code-editor в редактор.{% endcomment %}{% load ui_i18n %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
    .CodeMirror { border-radius: .75rem; font-size: 14px; line-height: 1.5; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .cm-s-monokai.CodeMirror { background: #272822; }
    .cm-s-monokai .cm-keyword  { color: #ff6ac1; font-weight: 600; }   /* if, for, while, def, in, return … */
    .cm-s-monokai .cm-builtin  { color: #5ad4e6; }                      /* print, input, int, range, len … */
    .cm-s-monokai .cm-def      { color: #a6e22e; }                      /* имя функции после def */
    .cm-s-monokai .cm-variable { color: #ffd479; }                      /* переменные */
    .cm-s-monokai .cm-variable-2 { color: #ffd479; }
    .cm-s-monokai .cm-property { color: #9cdcfe; }
    .cm-s-monokai .cm-string   { color: #98c379; }
    .cm-s-monokai .cm-number   { color: #bd93f9; }
    .cm-s-monokai .cm-comment  { color: #7f8c8d; font-style: italic; }
    .cm-s-monokai .cm-operator { color: #f8f8f2; }
    /* кнопка «Запустить» (Python в браузере, Pyodide) */
    .run-panel { margin: .5rem 0 .75rem; }
    .run-panel .run-in { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; background: #1f201b; color: #f8f8f2; border: 1px solid #49483e; border-radius: .5rem; width: 100%; min-height: 60px; padding: .4rem .6rem; resize: vertical; }
    .run-panel .run-out { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; background: #111; color: #e6e6e6; border-radius: .5rem; padding: .5rem .7rem; margin: .4rem 0 0; max-height: 260px; overflow: auto; white-space: pre-wrap; }
    .run-panel .run-out.err { color: #ff8a8a; }
    .run-panel .run-st { font-size: 12px; }
    /* подсказки автодополнения */
    .CodeMirror-hints { z-index: 2000; background: #1f201b; border: 1px solid #49483e; border-radius: .5rem; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; max-height: 14em; padding: 3px; }
    .CodeMirror-hint { color: #f8f8f2; border-radius: .3rem; padding: 2px 8px; display: flex; justify-content: space-between; gap: 14px; }
    .CodeMirror-hint .hk { color: #7f8c8d; font-size: 11px; }
    li.CodeMirror-hint-active { background: #3e7bfa; color: #fff; }
    li.CodeMirror-hint-active .hk { color: #dbe6ff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script>
(function () {
    if (!window.CodeMirror) { return; }   // нет сети/CDN — остаётся обычное поле ввода
    window.codeEditors = {};

    // ---- Подсказки при наборе (m → map, i → int/input …) ----
    var PY_KW = ['if','elif','else','for','while','in','not','and','or','def','return','break','continue',
                 'pass','import','from','as','True','False','None','lambda','try','except','finally','with','global','class','is','del'];
    var PY_FN = ['print','input','int','float','str','bool','list','dict','set','tuple','range','len','map','sum',
                 'min','max','abs','round','sorted','reversed','enumerate','zip','filter','ord','chr','pow','divmod',
                 'any','all','open','isinstance','type','bin','hex','oct','exit'];
    var PY_MOD = ['math','random','sqrt','floor','ceil','gcd','pi','randint','choice'];
    var CPP_WORDS = ['include','iostream','bits','stdc','using','namespace','std','int','long','double','float','char','bool',
                     'void','string','vector','pair','map','set','queue','deque','stack','priority_queue','cin','cout','endl',
                     'main','return','for','while','if','else','break','continue','const','auto','true','false','sort',
                     'reverse','max','min','abs','swap','sqrt','printf','scanf','getline','ios_base','sync_with_stdio','tie',
                     'unsigned','struct','memset','make_pair','lower_bound','upper_bound','accumulate','INT_MAX','LLONG_MAX'];
    var CPP_METH = ['push_back','pop_back','size','begin','end','back','front','insert','erase','find','count','substr',
                    'length','empty','clear','first','second','push','pop','top','resize','assign'];
    var CPP_TEMPLATE = '#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    \n    return 0;\n}\n';
    var PY_METH = ['append','split','join','strip','rstrip','lstrip','lower','upper','count','find','replace','sort',
                   'reverse','pop','insert','index','remove','extend','isdigit','isalpha','startswith','endswith',
                   'keys','values','items','get','add','copy','clear','title','capitalize','format','swapcase','isupper','islower'];
    function pyHint(cm) {
        var cur = cm.getCursor(), line = cm.getLine(cur.line);
        var st = cur.ch, en = cur.ch;
        while (st > 0 && /\w/.test(line.charAt(st - 1))) { st--; }
        while (en < line.length && /\w/.test(line.charAt(en))) { en++; }
        var word = line.slice(st, cur.ch);
        if (!word || /^\d/.test(word)) { return null; }
        var tok = cm.getTokenAt(cur);
        if (tok.type === 'string' || tok.type === 'comment') { return null; }
        var afterDot = st > 0 && line.charAt(st - 1) === '.';
        var seen = {}, out = [], low = word.toLowerCase();
        function add(w, kind) {
            if (seen[w] || w === word || w.toLowerCase().indexOf(low) !== 0) { return; }
            seen[w] = 1; out.push({text: w, kind: kind});
        }
        if (cm.getOption('mode') !== 'python') {      // C++ (олимпиада)
            if (afterDot) { CPP_METH.forEach(function (w) { add(w, 'метод'); }); }
            else { CPP_WORDS.forEach(function (w) { add(w, 'C++'); }); }
        } else if (afterDot) { PY_METH.forEach(function (w) { add(w, 'метод'); }); PY_MOD.forEach(function (w) { add(w, ''); }); }
        else {
            PY_FN.forEach(function (w) { add(w, 'функция'); });
            PY_KW.forEach(function (w) { add(w, 'слово'); });
            PY_MOD.forEach(function (w) { add(w, 'модуль'); });
        }
        // имена из уже написанного кода (переменные, функции)
        var re = /[A-Za-z_]\w*/g, m, txt = cm.getValue();
        while ((m = re.exec(txt))) { if (m[0].length > 1) { add(m[0], 'имя'); } }
        if (!out.length) { return null; }
        out.sort(function (a, b) { return a.text.length - b.text.length; });
        return {
            list: out.slice(0, 12).map(function (o) {
                return {text: o.text, render: function (el) {
                    var a = document.createElement('span'); a.textContent = o.text; el.appendChild(a);
                    if (o.kind) { var k = document.createElement('span'); k.className = 'hk'; k.textContent = o.kind; el.appendChild(k); }
                }};
            }),
            from: CodeMirror.Pos(cur.line, st), to: CodeMirror.Pos(cur.line, en)
        };
    }

    // ---- ▶ Запустить: Python прямо в браузере (Pyodide в Web Worker), лимит 2 секунды ----
    var RUN_CPP_URL = '{% url "run_cpp" %}';
    var RUN_LIMIT_MS = 2000, PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
    var TXT = {run: '▶ {% t "Запустить" %}', stop: '■ {% t "Стоп" %}', input: '{% t "Входные данные" %}',
               loading: '{% t "Загружаем Python в браузер… (первый раз до 15 секунд)" %}', running: '{% t "Выполняется…" %}',
               tl: '{% t "Превышено время: больше 2 секунд. Проверьте, нет ли бесконечного цикла." %}',
               ok: '{% t "Совпадает с примером вывода" %}', diff: '{% t "Не совпадает с примером вывода" %}',
               empty: '{% t "(пустой вывод)" %}', stopped: '{% t "Остановлено" %}',
               compiling: '{% t "Компилируем и запускаем на сервере…" %}', cerr: '{% t "Ошибка компиляции" %}',
               rerr: '{% t "Ошибка выполнения" %}', wait: '{% t "Подождите N секунд перед следующим запуском." %}',
               netfail: '{% t "Не удалось связаться с сервером." %}',
               cppnote: '{% t "C++ запускается на сервере: не чаще раза в 5 секунд, до 2 секунд. Попытки не тратятся." %}', fail: '{% t "Не удалось загрузить Python. Проверьте интернет." %}',
               note: '{% t "Запуск только для проверки — он не тратит попытки и нигде не сохраняется." %}'};
    var WORKER_SRC = [
        "importScripts('" + PYODIDE + "pyodide.js');",
        "var ready = loadPyodide({indexURL: '" + PYODIDE + "'}).then(function (p) {",
        "  self.py = p;",
        "  p.runPython('import sys, io, traceback, linecache\\ndef __run(src, inp):\\n    linecache.cache[\"main.py\"] = (len(src), None, src.splitlines(True), \"main.py\")\\n    sys.stdin = io.StringIO(inp)\\n    o = io.StringIO()\\n    sys.stdout = sys.stderr = o\\n    err = \"\"\\n    try:\\n        exec(compile(src, \"main.py\", \"exec\"), {\"__name__\": \"__main__\"})\\n    except SystemExit:\\n        pass\\n    except BaseException:\\n        err = traceback.format_exc()\\n    finally:\\n        sys.stdout, sys.stderr = sys.__stdout__, sys.__stderr__\\n    return [o.getvalue()[:20000], err]');",
        "  postMessage({t: 'ready'});",
        "}, function (e) { postMessage({t: 'fail', m: String(e)}); });",
        "onmessage = function (e) { ready.then(function () {",
        "  var d = e.data, run = self.py.globals.get('__run');",
        "  postMessage({t: 'start'});",
        "  var t0 = performance.now(), r = run(d.code, d.stdin).toJs();",
        "  var ms = Math.round(performance.now() - t0);",
        "  run.destroy();",
        "  postMessage({t: 'done', out: r[0], err: r[1], ms: ms});",
        "}); };"].join('\n');
    var worker = null, workerReady = false, workerFail = false, pending = null;
    function getWorker() {
        if (worker) { return worker; }
        workerReady = false; workerFail = false;
        worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], {type: 'text/javascript'})));
        worker.onmessage = function (e) {
            var m = e.data;
            if (m.t === 'ready') { workerReady = true; }
            else if (m.t === 'fail') { workerFail = true; if (pending) { pending.fail(); } }
            else if (pending) { pending.msg(m); }
        };
        return worker;
    }
    function killWorker() { if (worker) { worker.terminate(); } worker = null; workerReady = false; }
    function cleanTrace(err) {
        // оставляем только строки про код ученика, без внутренностей Pyodide
        var lines = err.split('\n'), i = lines.findIndex(function (l) { return l.indexOf('File "main.py"') !== -1; });
        var keep = i === -1 ? lines.slice(-3) : lines.slice(i);
        return 'Traceback (most recent call last):\n' + keep.join('\n').replace(/\n+$/, '');
    }
    function norm(t) { return t.replace(/\r/g, '').split('\n').map(function (l) { return l.replace(/\s+$/, ''); }).join('\n').replace(/\n+$/, ''); }
    function addRunner(cm, ta) {
        var box = document.createElement('div');
        box.className = 'run-panel';
        box.innerHTML = '<div class="d-flex flex-wrap align-items-center gap-2">' +
            '<button type="button" class="btn btn-sm btn-dark rounded-pill px-3 run-btn"></button>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 run-in-tg"></button>' +
            '<span class="run-st text-muted"></span></div>' +
            '<pre class="run-out" style="display:none"></pre>';
        var area = document.createElement('textarea');   // поле «Входные данные»
        area.className = 'run-in mt-2'; area.spellcheck = false; area.setAttribute('autocomplete', 'off'); area.style.display = 'none';
        box.insertBefore(area, box.querySelector('.run-out'));
        cm.getWrapperElement().insertAdjacentElement('afterend', box);
        var btn = box.querySelector('.run-btn'), tg = box.querySelector('.run-in-tg'), st = box.querySelector('.run-st'),
            inp = box.querySelector('.run-in'), out = box.querySelector('.run-out'), expect = ta.getAttribute('data-expect');
        btn.textContent = TXT.run; tg.textContent = TXT.input + ' ▾'; st.textContent = TXT.note;
        inp.value = ta.getAttribute('data-stdin') || '';
        if (inp.value) { inp.style.display = ''; }
        tg.onclick = function () { inp.style.display = inp.style.display ? '' : 'none'; };
        var running = false, timer = null;
        function finish() { running = false; btn.textContent = TXT.run; clearTimeout(timer); pending = null; }
        function show(text, isErr) { out.style.display = ''; out.textContent = text; out.classList.toggle('err', !!isErr); }
        function verdictFor(outText) {
            if (expect !== null && expect.trim() && inp.value === (ta.getAttribute('data-stdin') || '')) {
                return norm(outText) === norm(expect) ? ' · ✅ ' + TXT.ok : ' · ⚠️ ' + TXT.diff;
            }
            return '';
        }
        // C++: браузер его не выполняет — компилируем и запускаем на сервере (2 секунды, не чаще раза в 5 секунд)
        function runCpp() {
            var tok = document.querySelector('[name=csrfmiddlewaretoken]');
            var fd = new FormData();
            fd.append('code', cm.getValue()); fd.append('stdin', inp.value);
            if (tok) { fd.append('csrfmiddlewaretoken', tok.value); }
            btn.disabled = true; out.style.display = 'none'; st.textContent = TXT.compiling;
            fetch(RUN_CPP_URL, {method: 'POST', body: fd, credentials: 'same-origin'})
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    btn.disabled = false;
                    if (d.wait) { st.textContent = TXT.wait.replace('N', d.wait); return; }
                    if (d.compile_error) { st.textContent = TXT.cerr; show(d.compile_error, true); return; }
                    if (d.error === 'timeout') { st.textContent = ''; show((d.out || '') + TXT.tl, true); return; }
                    if (d.error) { st.textContent = d.ms + ' ms'; show((d.out || '') + (d.out ? '\n' : '') + TXT.rerr + ': ' + d.error, true); return; }
                    show(d.out || TXT.empty, false);
                    st.textContent = d.ms + ' ms' + verdictFor(d.out || '');
                })
                .catch(function () { btn.disabled = false; st.textContent = ''; show(TXT.netfail, true); });
        }
        btn.onclick = function () {
            if (cm.getOption('mode') !== 'python') { runCpp(); return; }
            if (running) { killWorker(); finish(); st.textContent = TXT.stopped; out.style.display = 'none'; return; }
            if (pending) { return; }   // другой редактор на странице ещё выполняется
            running = true; btn.textContent = TXT.stop; out.style.display = 'none';
            var w = getWorker();
            st.textContent = workerReady ? TXT.running : TXT.loading;
            pending = {
                fail: function () { finish(); killWorker(); st.textContent = ''; show(TXT.fail, true); },
                msg: function (m) {
                    if (m.t === 'start') {
                        st.textContent = TXT.running;
                        timer = setTimeout(function () { killWorker(); finish(); st.textContent = ''; show(TXT.tl, true); getWorker(); }, RUN_LIMIT_MS);
                    } else if (m.t === 'done') {
                        finish();
                        var text = m.out + (m.err ? (m.out && !/\n$/.test(m.out) ? '\n' : '') + cleanTrace(m.err) : '');
                        show(text || TXT.empty, !!m.err);
                        st.textContent = m.ms + ' ms' + (m.err ? '' : verdictFor(m.out));
                    }
                }
            };
            w.postMessage({code: cm.getValue(), stdin: inp.value});
        };
        // заранее прогреваем Python, когда ученик начал писать код
        cm.on('focus', function () { if (window.Worker && cm.getOption('mode') === 'python') { getWorker(); } });
        return box;
    }
    // Олимпиада: ученик выбирает язык (Python / C++) — меняем подсветку и подсказки;
    // кнопка «Запустить» работает только для Python (C++ проверяется на сервере при отправке).
    function bindLanguage(cm, ta, box) {
        var sel = ta.getAttribute('data-lang-select') && document.getElementById(ta.getAttribute('data-lang-select'));
        if (!sel) { return; }
        function apply(first) {
            var cpp = sel.value === 'cpp';
            cm.setOption('mode', cpp ? 'text/x-c++src' : 'python');
            if (box) { box.querySelector('.run-st').textContent = cpp ? TXT.cppnote : TXT.note; }

        }
        sel.addEventListener('change', function () { apply(false); });
        apply(true);
    }
    var HINT_OPTS = {hint: pyHint, completeSingle: false, closeCharacters: /[\s()\[\]{};:>,=+\-*\/%]/};
    document.querySelectorAll('textarea.code-editor').forEach(function (ta, i) {
        var cm = CodeMirror.fromTextArea(ta, {
            mode: 'python', theme: 'monokai', lineNumbers: true,
            indentUnit: 4, tabSize: 4, smartIndent: true, indentWithTabs: false,
            lineWrapping: false, viewportMargin: Infinity,
            extraKeys: {
                'Ctrl-Space': function (c) { if (c.showHint) { c.showHint(HINT_OPTS); } },
                Tab: function (c) { if (c.somethingSelected()) { c.indentSelection('add'); } else { c.execCommand('insertSoftTab'); } },
                'Shift-Tab': function (c) { c.indentSelection('subtract'); },
                // Backspace в начале строки стирает сразу целый отступ (4 пробела), как в IDE
                Backspace: function (c) {
                    if (c.somethingSelected()) { c.execCommand('delCharBefore'); return; }
                    var cur = c.getCursor(), before = c.getLine(cur.line).slice(0, cur.ch);
                    if (cur.ch > 0 && /^ +$/.test(before)) {
                        var n = before.length % 4 || 4;
                        c.replaceRange('', {line: cur.line, ch: cur.ch - n}, cur);
                    } else { c.execCommand('delCharBefore'); }
                }
            }
        });
        ta.removeAttribute('required');   // скрытое поле с required блокирует отправку без сообщения
        var inp = cm.getInputField();
        inp.setAttribute('autocapitalize', 'off');
        inp.setAttribute('autocorrect', 'off');
        inp.setAttribute('autocomplete', 'off');
        inp.setAttribute('spellcheck', 'false');
        cm.setSize('100%', ta.getAttribute('data-height') || 280);
        if (ta.disabled) { cm.setOption('readOnly', 'nocursor'); }
        cm.on('change', function () { cm.save(); });
        if (cm.showHint && !ta.disabled) {
            cm.on('inputRead', function (c, ch) {
                if (ch.origin === '+input' && /^[A-Za-z_]$/.test(ch.text.join('')) && !c.state.completionActive) {
                    c.showHint(HINT_OPTS);
                }
            });
        }
        var runBox = (!ta.disabled && window.Worker && !ta.hasAttribute('data-norun')) ? addRunner(cm, ta) : null;
        bindLanguage(cm, ta, runBox);
        window.codeEditors[ta.getAttribute('data-task') || ('e' + i)] = cm;
    });
})();
</script>
