<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function () { var t = null; try { t = localStorage.getItem('pifagor-theme'); } catch (e) {}
  if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.className = 'dark'; } })();</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Montserrat', system-ui, sans-serif; margin: 0; padding: 24px 28px; line-height: 1.6; color: #1f2937; background: #fff; }
    html.dark body { background: #111827; color: #e5e7eb; } html.dark a { color: #93c5fd; }
    .th { white-space: pre-wrap; word-break: break-word; font-size: 15px; max-width: 860px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; background: rgba(148,163,184,.12); border-radius: 12px; padding: 16px 18px; }
    h2 { margin: 0 0 12px; }
</style></head>
<body><h2>📖 {{ room.title|default:"Теория" }}</h2><div class="th">{{ room.theory_text|urlize }}</div></body></html>
