{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Pifagor Contest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            color: #1a1a4b;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .btn-pifagor-green {
            background-color: #008b42;
            color: #fff;
            font-weight: 600;
        }
        .btn-pifagor-green:hover {
            background-color: #007035;
            color: #fff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <div class="text-center mb-4">
                    <img src="{% static 'img/logo.svg' %}" alt="Pifagor Logo" height="70">
                </div>

                <div class="card auth-card p-4 bg-white">
                    <h4 class="fw-bold text-center mb-4" style="color: #1a1a4b;">Вход в систему</h4>

                    {% if error %}
                        <div class="alert alert-danger py-2 small rounded-3">{{ error }}</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Логин</label>
                            <input type="text" name="username" class="form-control rounded-3" placeholder="Ваш логин" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Пароль</label>
                            <input type="password" name="password" class="form-control rounded-3" placeholder="Ваш пароль" required>
                        </div>
                        <button type="submit" class="btn btn-pifagor-green w-100 py-2 rounded-3 mb-3">Войти</button>
                    </form>

                    <div class="text-center">
                        <a href="{% url 'register' %}" class="small text-decoration-none fw-semibold" style="color: #1a1a4b;">
                            Создать новый аккаунт
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
